name: ${COMPOSE_PROJECT_NAME:-whatsapp-archiver}

services:
  whatsapp-bridge:
    build:
      context: ./bridge
    restart: unless-stopped
    init: true
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      DATA_DIR: /data
      BRIDGE_PORT: 8765
      WHATSAPP_BRIDGE_MODE: "${WHATSAPP_BRIDGE_MODE:-live}"
    volumes:
      - "${DATA_DIR:-./data}:/data"
    expose:
      - "8765"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  app:
    depends_on:
      whatsapp-bridge:
        condition: service_healthy
    build: .
    restart: unless-stopped
    init: true
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/archive.db
      MEDIA_DIR: /data/media
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:8765
    ports:
      - "127.0.0.1:${VIEWER_PORT:-8000}:8000"
    volumes:
      - "${DATA_DIR:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3