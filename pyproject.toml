[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-export-archive"
version = "0.1.0"
description = "A local archive for WhatsApp chat exports"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]